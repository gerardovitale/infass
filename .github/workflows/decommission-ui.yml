name: Decommission UI

# One-off workflow: destroys the UI infrastructure (infra-ui) in the
# inflation-assistant-ui project. Delete this file once it has run successfully.

on:
  workflow_dispatch:

jobs:
  terraform-ui-destroy:
    name: Destroy UI infra with tf
    runs-on: ubuntu-latest
    env:
      TF_VAR_APP_NAME: infass
      TF_VAR_REGION: europe-southwest1
      TF_VAR_DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      TF_VAR_GCP_API_URL: ${{ vars.GCP_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_UI_CICD_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.10.4

      - name: Initialize Terraform
        working-directory: ./infra-ui
        run: terraform init

      - name: Destroy Terraform resources
        working-directory: ./infra-ui
        run: terraform destroy -auto-approve -input=false -var "DOCKER_IMAGE_TAG=decommissioned"
