name: Decommission UI

# One-off workflow: deletes the UI Cloud Run service in the
# inflation-assistant-ui project. The infra-ui Terraform state bucket no longer
# exists, so this uses gcloud directly. Delete this file once it has run.

on:
  workflow_dispatch:

jobs:
  delete-ui-service:
    name: Delete UI Cloud Run service
    runs-on: ubuntu-latest
    env:
      REGION: europe-southwest1
      SERVICE: infass-ui-service
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_UI_CICD_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: List Cloud Run services and buckets
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          echo "Project: ${PROJECT}"
          gcloud run services list --project "${PROJECT}" || true
          gcloud storage buckets list --project "${PROJECT}" --format="value(name)" || true

      - name: Delete UI service
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          if gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT}" >/dev/null 2>&1; then
            gcloud run services delete "${SERVICE}" --region "${REGION}" --project "${PROJECT}" --quiet
            echo "Deleted ${SERVICE}"
          else
            echo "${SERVICE} not found; nothing to delete"
          fi
