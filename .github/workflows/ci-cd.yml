name: CI/CD Pipeline

# Project decommissioned (2026-11): only the Mercadona ingestor is still
# tested, built and deployed. See README.md for details.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force all jobs to run"
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Change detection
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ingestor: ${{ steps.filter.outputs.ingestor }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingestor:
              - 'ingestor/**'
            infra:
              - 'infra/**'

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test-ingestor:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.ingestor == 'true' ||
      inputs.force_all == true
    uses: gerardovitale/github-workflows/.github/workflows/test-service.yml@v1
    with:
      service: ingestor

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build-ingestor:
    needs: [detect-changes, test-ingestor]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.ingestor == 'true' ||
       inputs.force_all == true)
    uses: gerardovitale/github-workflows/.github/workflows/build-service.yml@v1
    with:
      service: ingestor
      image_prefix: "infass-"
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Terraform deploy
  # ---------------------------------------------------------------------------
  terraform-deploy:
    name: Deploy infra with tf
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-ingestor
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.ingestor == 'true' ||
       needs.detect-changes.outputs.infra == 'true' ||
       inputs.force_all == true)
    env:
      TF_VAR_APP_NAME: infass
      TF_VAR_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_REGION: europe-southwest1
      TF_VAR_DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      TF_VAR_GCP_USER: ${{ secrets.GCP_USER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CICD_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: 1.10.4

      - name: Terraform fmt
        run: terraform fmt -check
        continue-on-error: false

      - name: Initialize Terraform
        working-directory: ./infra
        run: terraform init

      - name: Determine Docker image tag
        id: tags
        working-directory: ./infra
        run: |
          # Re-use the tag from the last successful apply unless the ingestor
          # changed, so Terraform sees no diff and skips redeployment.
          if [[ "${{ needs.detect-changes.outputs.ingestor }}" == "true" \
              || "${{ inputs.force_all }}" == "true" ]]; then
            TAG="${GITHUB_SHA::7}"
          else
            TAG="$(terraform output -raw docker_image_tag_ingestor 2>/dev/null || echo "${GITHUB_SHA::7}")"
          fi
          echo "tag_INGESTOR=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Plan Terraform changes
        working-directory: ./infra
        run: |
          terraform plan -input=false \
            -var "DOCKER_IMAGE_TAG_INGESTOR=${{ steps.tags.outputs.tag_INGESTOR }}"

      - name: Apply Terraform changes
        working-directory: ./infra
        run: |
          terraform apply -auto-approve -input=false \
            -var "DOCKER_IMAGE_TAG_INGESTOR=${{ steps.tags.outputs.tag_INGESTOR }}"
